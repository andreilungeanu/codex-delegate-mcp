name: test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
        include:
          - os: ubuntu-latest
            node-version: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run test:pack

  # Platform-independent gates, so once is enough rather than once per matrix leg.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Floors sit just under measured coverage, so a regression trips them rather than
      # spending headroom that was never noticed. Raise them when coverage rises, not to
      # whatever a run happens to report.
      - name: Coverage floor
        id: coverage
        env:
          # The runner copies every process's coverage file here, the unreadable one included.
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage
        run: >
          node scripts/run-tests.mjs --experimental-test-coverage --test-coverage-include='src/**'
          --test-coverage-lines=95 --test-coverage-branches=87 --test-coverage-functions=90
      - name: Name unreadable coverage files
        if: failure() && steps.coverage.outcome == 'failure'
        run: node scripts/name-broken-coverage.mjs "$RUNNER_TEMP/v8-coverage"
      - name: Audit production dependencies
        timeout-minutes: 5
        env:
          # Bound each request; retry the whole audit if the registry is unavailable.
          NPM_CONFIG_FETCH_RETRIES: 0
          NPM_CONFIG_FETCH_TIMEOUT: 30000
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm audit failed (attempt $attempt/3); retrying."
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::npm audit failed after 3 attempts; a passing audit is required."
          exit 1

  # The lockfile resolves a newer SDK; make sure the declared minimum keeps working.
  min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save @modelcontextprotocol/server@2.4.0 @modelcontextprotocol/client@2.4.0
      - run: npm test
